[project]
name = "bnc-lookup"
version = "1.5.0"
description = "Static Hash-Based Lookup for BNC Terms"
readme = "README.md"
license = "MIT"
requires-python = ">=3.7"

authors = [
  { name = "Craig Trim", email = "craigtrim@gmail.com" },
]

maintainers = [
  { name = "Craig Trim", email = "craigtrim@gmail.com" },
]

keywords = [
  "bnc",
  "lexicon",
  "nlp",
  "natural-language-processing",
  "dictionary",
  "vocabulary",
  "validation",
  "linguistics",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Text Processing :: Linguistic",
  "Natural Language :: English",
  "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/craigtrim/bnc-lookup"

[project.scripts]
bnc-exists = "bnc_lookup.cli:exists"
bnc-bucket = "bnc_lookup.cli:bucket"
bnc-freq = "bnc_lookup.cli:freq"
bnc-expected = "bnc_lookup.cli:expected"

[tool.poetry]

[tool.poetry.build]
generate-setup-file = true

[tool.poetry.group.dev.dependencies]
autopep8 = "*"
ruff = "*"
plac = "*"
pre-commit = "^2.20.0"
pytest = "*"

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=1.0.0"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"bnc_lookup/__init__.py" = ["F401"]
"bnc_lookup/sx/__init__.py" = ["F401"]

[tool.mypy]
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]

explicit_package_bases = true
files = "src"
mypy_path = "src"
namespace_packages = true
show_error_codes = true
strict = false
